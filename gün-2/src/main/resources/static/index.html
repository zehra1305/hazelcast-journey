<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazelcast | Merkezi Kullanıcı Kayıt Sistemi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .main-header h1 {
            color: #1a237e;
            margin: 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .main-header p {
            color: #666;
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .badge {
            font-size: 11px;
            background: #e8eaf6;
            color: #3f51b5;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
        }
        input {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #3f51b5;
            outline: none;
            box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.15);
        }
        .btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }
        button {
            background-color: #3f51b5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background-color: #303f9f; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 14px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        tr:hover { background-color: #f8fafc; }

        .refresh-btn {
            background-color: #0f172a;
            padding: 8px 16px;
            font-size: 13px;
        }
        .refresh-btn:hover { background-color: #1e293b; }

        .status-msg {
            font-size: 13px;
            color: #059669;
            font-weight: 500;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="main-header">
    <h1>Personel ve Kullanıcı Kayıt Sistemi</h1>
    <p>Hazelcast Distributed In-Memory Veri Deposu Altyapısı ile</p>
</div>

<div class="container">
    <h2>Yeni Kullanıcı Tanımlama Modülü <span class="badge">POST /koy</span></h2>
    <form id="kullaniciForm">
        <div class="form-grid">
            <div class="form-group">
                <label>Adı</label>
                <input type="text" id="adi" required placeholder=>
            </div>
            <div class="form-group">
                <label>Soyadı</label>
                <input type="text" id="soyadi" required placeholder=>
            </div>
            <div class="form-group">
                <label>Telefon Numarası</label>
                <input type="text" id="telefon" required placeholder="Örn: 0555...">
            </div>
            <div class="form-group">
                <label>Yaş</label>
                <input type="number" id="yas" required placeholder="Örn: 22">
            </div>
            <div class="form-group full-width">
                <label>E-Posta Adresi (Sistem Benzersiz Anahtarı)</label>
                <input type="email" id="email" required placeholder="Örn: ...@gmail.com">
            </div>
        </div>
        <div class="btn-container">
            <button type="submit">Sisteme Güvenli Kaydet</button>
        </div>
        <div id="statusMessage" class="status-msg"></div>
    </form>
</div>

<div class="container">
    <h2>
        Aktif Veritabanı ve Bellek İzleme Paneli
        <button class="refresh-btn" onclick="verileriGetir()">Kayıtları Yenile</button>
    </h2>
    <table>
        <thead>
        <tr>
            <th>Adı</th>
            <th>Soyadı</th>
            <th>Telefon</th>
            <th>E-Posta (Key)</th>
            <th>Yaş</th>
        </tr>
        </thead>
        <tbody id="veriTablosu">
        </tbody>
    </table>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080';

    document.addEventListener("DOMContentLoaded", () => {
        verileriGetir();
    });

    // VERİ KAYDETME SÜRECİ
    document.getElementById('kullaniciForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const dto = {
            adi: document.getElementById('adi').value,
            soyadi: document.getElementById('soyadi').value,
            telefon: document.getElementById('telefon').value,
            email: document.getElementById('email').value,
            yas: parseInt(document.getElementById('yas').value)
        };

        fetch(`${API_BASE_URL}/koy`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dto)
        })
            .then(response => response.text())
            .then(data => {
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.innerText = `✓ ${data} adlı kullanıcı başarıyla cluster hafızasına işlendi.`;
                statusDiv.style.display = 'block';

                document.getElementById('kullaniciForm').reset();
                verileriGetir();

                setTimeout(() => { statusDiv.style.display = 'none'; }, 4000);
            })
            .catch(error => {
                console.error('Hata:', error);
                alert('Bağlantı hatası: Lütfen Spring Boot uygulamasının çalıştığından emin olun.');
            });
    });

    // VERİ ÇEKME SÜRECİ
    function verileriGetir() {
        fetch(`${API_BASE_URL}/getir`)
            .then(response => response.json())
            .then(data => {
                const tabloBody = document.getElementById('veriTablosu');
                tabloBody.innerHTML = '';

                if(data.length === 0) {
                    tabloBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Sistemde kayıtlı aktif veri bulunmamaktadır.</td></tr>';
                    return;
                }

                data.forEach(user => {
                    const row = `<tr>
                        <td style="font-weight: 500; color: #1e293b;">${user.adi || ''}</td>
                        <td>${user.soyadi || ''}</td>
                        <td>${user.telefon || ''}</td>
                        <td style="color: #6366f1; font-family: monospace;">${user.email || ''}</td>
                        <td><span style="background: #f1f5f9; padding: 3px 8px; border-radius: 4px;">${user.yas || ''}</span></td>
                    </tr>`;
                    tabloBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Hata:', error);
            });
    }
</script>
</body>
</html>
